[package]
name = "open_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = { path = "bootloader_api" }
lazy_static = { version = "1.5", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
pic8259 = "0.10"
spin = "0.9"
uart_16550 = "0.3"
volatile = "0.2.6"
x86_64 = "0.15"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
